<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DBA SQL 工具</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#16181d;color:#e6e8eb;font-size:14px}
  header{padding:12px 16px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;margin:0 8px 0 0} .sub{color:#8b9096;font-size:12px}
  .tabs{display:flex;gap:6px;padding:10px 16px 0;flex-wrap:wrap}
  .tab{padding:6px 12px;border:1px solid #2c3038;border-radius:999px;background:#1e2126;color:#c9cdd3;cursor:pointer}
  .tab.active{background:#2563eb;border-color:#2563eb;color:#fff}
  .row{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap;align-items:center}
  select,input[type=checkbox]{accent-color:#2563eb}
  select{background:#1e2126;color:#e6e8eb;border:1px solid #2c3038;border-radius:6px;padding:6px 8px}
  label{color:#aab0b8;font-size:13px;display:flex;gap:4px;align-items:center}
  textarea{width:calc(100% - 32px);margin:0 16px;height:150px;background:#0f1114;color:#e6e8eb;border:1px solid #2c3038;border-radius:8px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.6;resize:vertical}
  .btns{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap}
  button{padding:8px 14px;border-radius:8px;border:1px solid #2c3038;background:#2563eb;color:#fff;cursor:pointer;font-size:13px}
  button.ghost{background:#1e2126;color:#e6e8eb}
  pre{margin:0 16px 12px;min-height:120px;max-height:300px;overflow:auto;background:#0f1114;border:1px solid #2c3038;border-radius:8px;padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
  .warn{margin:0 16px 14px;color:#f5b544;font-size:12px;line-height:1.6;white-space:pre-wrap}
  .hint{margin:0 16px 14px;color:#8b9096;font-size:12px;line-height:1.6}
  .ok{color:#4ade80}
  input[type=text]{background:#0f1114;color:#e6e8eb;border:1px solid #2c3038;border-radius:8px;padding:8px 10px;font-size:13px;flex:1;min-width:160px}
  .tb-wrap{display:none;padding:0 16px 14px}
  .tb-wrap.show{display:block}
  .tb-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tb-bar select{flex:0 0 auto}
  .tb-count{color:#8b9096;font-size:12px;align-self:center}
  .tb-pane{display:flex;gap:10px;height:380px}
  .tb-list{flex:0 0 42%;overflow:auto;border:1px solid #2c3038;border-radius:8px;background:#0f1114}
  .tb-item{padding:9px 10px;border-bottom:1px solid #1e2126;cursor:pointer}
  .tb-item:hover{background:#1a1d22}
  .tb-item.active{background:#1e2a44}
  .tb-item .t{font-size:13px;line-height:1.4}
  .tb-item .m{color:#8b9096;font-size:11px;margin-top:3px}
  .badge{display:inline-block;padding:1px 6px;border-radius:999px;font-size:11px;margin-left:6px}
  .badge.readonly{background:#12351f;color:#4ade80}
  .badge.caution{background:#3d2f10;color:#f5b544}
  .badge.danger{background:#3d1414;color:#f87171}
  .tb-detail{flex:1;overflow:auto;border:1px solid #2c3038;border-radius:8px;background:#0f1114;padding:12px}
  .tb-detail h3{margin:0 0 6px;font-size:14px}
  .tb-detail .meta{color:#8b9096;font-size:12px;line-height:1.7;margin-bottom:8px}
  .tb-detail pre{margin:8px 0;min-height:80px;max-height:220px;border:none;padding:0;background:transparent}
  .tb-detail .notes{color:#f5b544;font-size:12px;line-height:1.6;white-space:pre-wrap}
</style>
</head>
<body>
<header><h1>🛢️ DBA SQL 工具</h1><span class="sub">v0.3 · 本地运行，不联网 · 脚本库 327 条</span></header>
<div class="tabs" id="tabs">
  <div class="tab active" data-tab="format">格式化</div>
  <div class="tab" data-tab="convert">方言互转</div>
  <div class="tab" data-tab="desens">脱敏</div>
  <div class="tab" data-tab="listin">列表转 IN</div>
  <div class="tab" data-tab="ts">时间戳</div>
  <div class="tab" data-tab="toolbox">脚本库 · 327</div>
</div>

<div class="tb-wrap" id="toolboxView">
  <div class="tb-bar">
    <input type="text" id="tbSearch" placeholder="搜标题 / 关键词，如：慢SQL、AWR、表空间、RMAN、锁…">
    <select id="tbDb"><option value="all">全部数据库</option></select>
    <select id="tbCat"><option value="all">全部分类</option></select>
    <select id="tbRisk"><option value="all">全部风险</option><option value="只读">只读</option><option value="谨慎">谨慎</option><option value="危险">危险</option></select>
    <span class="tb-count" id="tbCount"></span>
  </div>
  <div class="tb-pane">
    <div class="tb-list" id="tbList"></div>
    <div class="tb-detail" id="tbDetail"><p style="color:#8b9096">在左侧选一条脚本，这里显示完整 SQL，点「复制 SQL」直接粘贴到客户端用。<br><br>危险操作只给模板，执行前先看黄色提醒。</p></div>
  </div>
  <div class="btns" style="padding:12px 0 0">
    <button id="tbCopy">复制 SQL</button>
    <button class="ghost" id="tbCopyHide">复制并关闭</button>
  </div>
</div>

<div id="toolsView">

<div class="row">
  <label>方言 <select id="dialect"><option value="oracle">Oracle</option><option value="mysql">MySQL</option><option value="postgres">PostgreSQL</option><option value="sqlserver">SQL Server</option></select></label>
  <label>缩进 <select id="indent"><option value="2">2 空格</option><option value="4">4 空格</option></select></label>
  <label><input type="checkbox" id="upper" checked> 关键字大写</label>
  <label id="convertRow" style="display:none">转到 <select id="targetDialect"><option value="mysql">MySQL</option><option value="oracle">Oracle</option></select></label>
</div>

<textarea id="input" placeholder="粘贴 SQL / 列表 / 时间戳到这里…&#10;示例：select a,b from t where id=1 and name='x' order by a"></textarea>

<div class="btns">
  <button id="run">▶ 运行</button>
  <button class="ghost" id="compress">压缩成一行</button>
  <button class="ghost" id="copy">复制结果</button>
  <button class="ghost" id="sample">填示例</button>
  <button class="ghost" id="clear">清空</button>
</div>

<pre id="output">结果会显示在这里</pre>
<div class="warn" id="warn"></div>
<div class="hint" id="hint">用法：Alt+空格 输入「SQL格式化」打开；或选中 SQL 后鼠标中键呼出超级面板选「格式化这段 SQL」；也可以直接把 SQL 粘贴进 uTools 输入框匹配。脚本库：输入「DBA工具箱」打开，搜标题或关键词。</div>
</div>

<script src="./lib/sql-core.js"></script>
<script>
(function(){
  var core = window.sqlCore || (window.services || {});
  var tab='format', $=function(id){return document.getElementById(id)};
  function svc(name){ return (window.services && window.services[name]) || (window.sqlCore && window.sqlCore[name]); }
  function getInput(){ return $('input').value; }
  function setOut(t, w){
    $('output').textContent = t || '(无结果)';
    $('warn').textContent = w || '';
  }
  function run(){
    var inp=getInput(), out='', warns=[];
    try{
      if(tab==='format'){
        out = svc('formatSql')(inp,{dialect:$('dialect').value, indent:+$('indent').value, uppercaseKeywords:$('upper').checked});
      } else if(tab==='convert'){
        var r = svc('convertDialect')(inp, $('dialect').value, $('targetDialect').value);
        out = r.sql; warns = r.warnings||[];
      } else if(tab==='desens'){
        out = svc('desensitizeSql')(inp);
        warns=['字符串已替换为 ***，数字已替换为 ?，发给别人 / 贴工单前请再看一眼'];
      } else if(tab==='listin'){
        var li = svc('listToIn')(inp,{});
        out = li.sql; if(li.warning) warns=[li.warning];
        if(li.count) $('hint').textContent = '共 '+li.count+' 个，去重后';
      } else if(tab==='ts'){
        var ts = svc('timestampConvert')(inp);
        out = ts.out || ts.hint; if(ts.hint) warns=[ts.hint];
      }
    }catch(e){ out='出错：'+e.message; }
    setOut(out, warns.join('\n'));
  }
  document.querySelectorAll('.tab').forEach(function(el){
    el.onclick=function(){
      document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
      el.classList.add('active'); tab=el.dataset.tab;
      var isTb = tab==='toolbox';
      $('toolboxView').classList.toggle('show', isTb);
      $('toolsView').style.display = isTb ? 'none' : 'block';
      if (isTb) { initToolbox(); return; }
      $('convertRow').style.display = tab==='convert' ? 'flex':'none';
      $('hint').textContent = tab==='convert' ? '只做 Oracle <-> MySQL 规则互转，不是完整转译，上线前务必在测试库跑一遍。'
        : tab==='desens' ? '脱敏：字符串 → ***，数字 → ?，适合贴慢日志 / 执行计划求助。'
        : tab==='listin' ? '每行一个值，或逗号分隔。Oracle IN 超过 1000 个会报 ORA-01795。'
        : tab==='ts' ? '支持 10 位秒 / 13 位毫秒时间戳，或 YYYY-MM-DD HH:mm:ss 互转。'
        : '用法：Alt+空格 输入「SQL格式化」打开；或选中 SQL 后鼠标中键呼出超级面板选「格式化这段 SQL」。';
      run();
    };
  });

  // ---- Toolbox: 327 scripts search ----
  var tbItems=[], tbSelected=null, tbLoaded=false;
  function tbFlatten(data){
    var out=[];
    (data.databases||[]).forEach(function(db){
      (db.categories||[]).forEach(function(cat){
        (cat.subcategories||[]).forEach(function(sub){
          (sub.items||[]).forEach(function(it){
            out.push({id:it.id, db:db.id, dbName:db.name, dbVersions:db.versions, category:cat.name, subcategory:sub.name,
              title:it.title, versions:it.versions, risk:it.risk, desc:it.desc||'',
              sql:it.sql||'', params:it.params||[], notes:it.notes||''});
          });
        });
      });
    });
    return out;
  }
  function tbLoad(){
    if (tbLoaded) return Promise.resolve(tbItems);
    // Prefer preload (Node fs, works in uTools file://); fallback to fetch for browser preview
    if (window.services && window.services.loadToolbox) {
      try { tbItems = tbFlatten(window.services.loadToolbox()); tbLoaded = true; return Promise.resolve(tbItems); } catch(e){}
    }
    return fetch('./data/toolbox-filled.json').then(function(r){ return r.json(); }).then(function(d){
      tbItems = tbFlatten(d); tbLoaded = true; return tbItems;
    }).catch(function(){ tbItems=[]; tbLoaded=true; return tbItems; });
  }
  function tbRiskBadge(r){
    var cls = r==='只读' ? 'readonly' : r==='谨慎' ? 'caution' : 'danger';
    return '<span class="badge '+cls+'">'+r+'</span>';
  }
  function tbSearch(){
    var q = $('tbSearch').value || '';
    var f = { db: $('tbDb').value, category: $('tbCat').value, risk: $('tbRisk').value };
    var results;
    if (window.services && window.services.searchToolbox) {
      try { results = window.services.searchToolbox(q, f); } catch(e){ results = null; }
    }
    if (!results) {
      var ql = q.trim().toLowerCase();
      results = tbItems.filter(function(it){
        if (f.db!=='all' && it.db!==f.db) return false;
        if (f.category!=='all' && it.category!==f.category) return false;
        if (f.risk!=='all' && it.risk!==f.risk) return false;
        if (!ql) return true;
        return ql.split(/\s+/).every(function(w){
          var hay = [it.title,it.desc,it.dbName,it.category,it.subcategory,it.notes,it.versions,it.sql||''].join(' ');
          if (/^[A-Za-z0-9_]+$/.test(w)) {
            try { return new RegExp('(?<![A-Za-z])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-z])','i').test(hay); }
            catch(e){ return hay.toLowerCase().indexOf(w)!==-1; }
          }
          return hay.toLowerCase().indexOf(w)!==-1;
        });
      });
    }
    $('tbCount').textContent = '共 '+results.length+' 条';
    var list = $('tbList');
    list.innerHTML = results.slice(0,200).map(function(it){
      return '<div class="tb-item'+(tbSelected&&tbSelected.id===it.id?' active':'')+'" data-id="'+it.id+'"><div class="t">'+it.title+tbRiskBadge(it.risk)+'</div><div class="m">'+it.dbName+' · '+it.category+' · '+it.subcategory+' · '+it.versions+'</div></div>';
    }).join('') || '<div style="padding:12px;color:#8b9096">没找到，换个关键词试试（比如：慢SQL、表空间、RMAN）</div>';
    list.querySelectorAll('.tb-item').forEach(function(el){
      el.onclick = function(){ tbShow(el.dataset.id); };
    });
    if (!tbSelected || !results.some(function(r){ return r.id===tbSelected.id; })) {
      if (results.length) tbShow(results[0].id, true);
      else { tbSelected=null; $('tbDetail').innerHTML='<p style="color:#8b9096">没找到匹配的脚本。</p>'; }
    }
    return results;
  }
  function tbShow(id, silent){
    var it = tbItems.find(function(x){ return x.id===id; });
    if (!it) return;
    tbSelected = it;
    document.querySelectorAll('.tb-item').forEach(function(el){ el.classList.toggle('active', el.dataset.id===id); });
    var params = it.params && it.params.length ? '<br>占位符：'+it.params.join('、')+'（替换成自己的值再执行）' : '';
    $('tbDetail').innerHTML = '<h3>'+it.title+tbRiskBadge(it.risk)+'</h3>'
      + '<div class="meta">'+it.dbName+'（'+(it.dbVersions||'')+'） · '+it.category+' · '+it.subcategory+'<br>适用版本：'+it.versions+' · '+(it.desc||'')+params+'</div>'
      + '<pre>'+it.sql.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre>'
      + (it.notes ? '<div class="notes">⚠️ '+it.notes.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>' : '');
  }
  function tbInitFilters(){
    var dbs = {}, cats = {};
    tbItems.forEach(function(it){ dbs[it.db]=it.dbName; cats[it.category]=1; });
    $('tbDb').innerHTML = '<option value="all">全部数据库</option>' + Object.keys(dbs).map(function(k){ return '<option value="'+k+'">'+dbs[k]+'</option>'; }).join('');
    $('tbCat').innerHTML = '<option value="all">全部分类</option>' + Object.keys(cats).map(function(k){ return '<option value="'+k+'">'+k+'</option>'; }).join('');
  }
  function initToolbox(){
    tbLoad().then(function(){
      if (!$('tbDb').dataset.init) { tbInitFilters(); $('tbDb').dataset.init='1'; }
      tbSearch();
    });
  }
  $('tbSearch').addEventListener('input', tbSearch);
  $('tbDb').addEventListener('change', tbSearch);
  $('tbCat').addEventListener('change', tbSearch);
  $('tbRisk').addEventListener('change', tbSearch);
  $('tbSearch').addEventListener('keydown', function(e){
    if (e.key==='Enter' && tbSelected) { tbCopySql(false); }
  });
  function tbCopySql(hide){
    if (!tbSelected) return;
    var t = tbSelected.sql || '';
    if (window.services && window.services.copyText) window.services.copyText(t);
    else if (navigator.clipboard) navigator.clipboard.writeText(t);
    $('tbCopy').textContent='已复制 ✓'; setTimeout(function(){ $('tbCopy').textContent='复制 SQL'; }, 1200);
    if (hide && window.services && window.services.hideMainWindow) window.services.hideMainWindow();
  }
  $('tbCopy').onclick=function(){ tbCopySql(false); };
  $('tbCopyHide').onclick=function(){ tbCopySql(true); };
  $('run').onclick=run;
  $('compress').onclick=function(){ var c=svc('compressSql')(getInput()); setOut(c,''); };
  $('copy').onclick=function(){
    var t=$('output').textContent;
    if(window.services && window.services.copyText) window.services.copyText(t);
    else if(navigator.clipboard) navigator.clipboard.writeText(t);
    $('copy').textContent='已复制 ✓'; setTimeout(function(){$('copy').textContent='复制结果'},1200);
  };
  $('sample').onclick=function(){
    if(tab==='listin'){ $('input').value="1001\n1002\n1003\n张三\n李四"; }
    else if(tab==='ts'){ $('input').value="1732521600"; }
    else if(tab==='convert'){ $('input').value="SELECT NVL(name,'未知'), TO_CHAR(created_at,'YYYY-MM-DD') FROM users WHERE ROWNUM <= 10"; $('dialect').value='oracle'; $('targetDialect').value='mysql'; }
    else if(tab==='desens'){ $('input').value="select * from users where phone='13800138000' and age=30"; }
    else { $('input').value="select a,b,count(*) c from t where id=1 and name='x' group by a,b order by c desc"; }
    run();
  };
  $('clear').onclick=function(){ $('input').value=''; setOut('',''); };
  $('input').addEventListener('input', function(){ if(getInput().trim().length>3) run(); });

  // uTools enter payload: regex / files mode passes selected text or file path
  setTimeout(function(){
    try{
      // Entered via "DBA工具箱" keyword: open on Toolbox tab
      var code = window.__UTOOLS_ENTER_CODE__;
      if (!code && window.services && window.services.getEnterAction) {
        var ea = window.services.getEnterAction(); if (ea) code = ea.code;
      }
      if (code === 'toolbox') {
        document.querySelector('.tab[data-tab="toolbox"]').click();
        var sub = '';
        try {
          var ea2 = window.services && window.services.getEnterAction ? window.services.getEnterAction() : null;
          if (ea2 && ea2.payload) sub = typeof ea2.payload === 'string' ? ea2.payload : '';
        } catch(e){}
        if (sub) { $('tbSearch').value = sub; tbSearch(); }
        return;
      }
      var p = window.__UTOOLS_ENTER_PAYLOAD__;
      if(!p && window.services && window.services.getEnterAction){
        var a = window.services.getEnterAction(); if(a) p = a.payload;
      }
      if(typeof p === 'string' && p.trim()){
        $('input').value = p; run();
      } else if(Array.isArray(p) && p.length && p[0].path && window.services && window.services.readTextFile){
        var txt = window.services.readTextFile(p[0].path);
        if(txt){ $('input').value = txt; run(); }
      }
    }catch(e){}
  }, 300);
})();
</script>
</body>
</html>
